nov26-1-05","type":"choice","q":"איזו מדיניות הגירה נכללת בהגדרה של מדינה יהודית אתנית־תרבותית דמוקרטית במסמך?","answer":"העדפה ללאום היהודי וזכות לכל יהודי לעלות","tag":"הגירה","options":["העדפה ללאום היהודי וזכות לכל יהודי לעלות","מדיניות הגירה ללא העדפה והגדרת הלאום לפי אזרחות בלבד","העדפה שווה לשני לאומים כחלק מזהות קולקטיבית כפולה","ביטול כל זיקה בין הגירה לבין הלאום היהודי"],"explanation":"הסיכום מונה העדפה ללאום היהודי במדיניות ההגירה, לצד מחויבות לשוויון מלא בין מי שהם אזרחים."},{"id":"nov26-1-06","type":"blank","q":"לפי העמדה של מדינת לאום אזרחית דמוקרטית, תהיה חפיפה ____ בין לאומיות לאזרחות.","answer":"מלאה","tag":"אזרחות ולאומיות","accept":[],"explanation":"הלאומיות מוגדרת לפי האזרחות הישראלית בלבד; לכן שתי הקבוצות חופפות במודל זה."},{"id":"nov26-1-07","type":"choice","q":"איזה שינוי בסמלים מבקשת העמדה הדו־לאומית הדמוקרטית?","answer":"לבטא במידה שווה גם את הזהות הערבית וגם את היהודית","tag":"דו־לאומיות","options":["לבטא במידה שווה גם את הזהות הערבית וגם את היהודית","לבטא זהות אזרחית בלבד, בלי ביטוי לאף אחת משתי הזהויות","להותיר ביטוי יהודי בלבד ולהעניק זכויות אישיות שוות","להחליף סמלים לאומיים בסמלים המבטאים הלכה בכל תחומי החיים"],"explanation":"השינוי נוגע לזהות הקולקטיבית: ביטוי מקביל ושווה לשני הלאומים, ולא רק שוויון בין אזרחים."},{"id":"nov26-1-08","type":"choice","q":"מה משותף לכל האזרחים ברמת הזהות הלאומית במודל האזרחי הדמוקרטי?","answer":"האזרחות הישראלית היא הבסיס היחיד לזהות הלאומית","tag":"לאומיות אזרחית","options":["האזרחות הישראלית היא הבסיס היחיד לזהות הלאומית","השתייכות לאחד משני לאומים מוכרים היא הבסיס המשותף","מורשתו של לאום אחד והכרה בזכויות לקבוצות אחרות","השתייכות ללאום האתני היהודי בארץ ובתפוצות"],"explanation":"המודל מגדיר זהות לאומית אזרחית בלבד, ומבקש להימנע מזיקה לאומית של המדינה לקבוצה אתנית־תרבותית."},{"id":"nov26-1-09","type":"blank","q":"לפי המודל הדו־לאומי הדמוקרטי, לצד הלאום היהודי המדינה מזוהה באופן קולקטיבי ובאותה מידה עם הלאום ____ .","answer":"הערבי","tag":"דו־לאומיות","accept":["ערבי"],"explanation":"זהות המדינה הדו־לאומית נקשרת לשני הלאומים, היהודי והערבי, במשקל שווה."},{"id":"nov26-1-10","type":"choice","q":"איזו עמדה קובעת שבכל מתח בין היסוד היהודי לדמוקרטי, היהודי בהכרח גובר?","answer":"מדינת לאום יהודית אתנית לא דמוקרטית","tag":"זהות לאומית","options":["מדינת לאום יהודית אתנית לא דמוקרטית","מדינת לאום יהודית אתנית־תרבותית דמוקרטית","מדינה דו־לאומית דמוקרטית","מדינת לאום אזרחית דמוקרטית"],"explanation":"ההכרעה הקבועה מראש והיעדר מחויבות הכרחית לשוויון זכויות מלא מאפיינים את העמדה היהודית האתנית הלא דמוקרטית."},{"id":"nov26-1-11","type":"choice","q":"מה נכון לגבי שלילת אזרחותם של אזרחים ערבים בעמדה היהודית האתנית הלא דמוקרטית?","answer":"היא מופיעה בגרסה הקיצונית של העמדה","tag":"זהות לאומית","options":["היא מופיעה בגרסה הקיצונית של העמדה","היא תנאי הכרחי בכל גרסה של העמדה","היא מאפיין של המודל הדו־לאומי הדמוקרטי","היא המנגנון שיוצר חפיפה במודל האזרחי הדמוקרטי"],"explanation":"המסמך מייחס שלילת אזרחות לגרסה הקיצונית. אין לייחס את הדרישה לכל גרסה של העמדה."},{"id":"nov26-1-12","type":"blank","q":"במודל האזרחי הדמוקרטי אין עדיפות לאומית במדיניות ההגירה, ולכן יבוטל חוק ____ .","answer":"השבות","tag":"הגירה","accept":["שבות"],"explanation":"ביטול חוק השבות כאן הוא חלק מביטול העדפה בהגירה על בסיס השתייכות לאומית."},{"id":"nov26-1-13","type":"choice","q":"שתי דוברות מסכימות שמורשת יהודית צריכה להיות נוכחת במרחב הציבורי ומחויבות לשוויון מלא, אך חלוקות על היקף הנוכחות. מה אפשר להסיק?","answer":"שתיהן יכולות להימצא בתוך העמדה היהודית האתנית־תרבותית הדמוקרטית","tag":"רצף דעות","options":["שתיהן יכולות להימצא בתוך העמדה היהודית האתנית־תרבותית הדמוקרטית","האחת בהכרח תומכת במדינת הלכה והשנייה בהפרדה מלאה","הוויכוח מוכיח שאחת מהן אינה מחויבת לדמוקרטיה","שתיהן בהכרח תומכות בזהות דו־לאומית שווה"],"explanation":"בתוך אותה עמדה אפשר להסכים לעקרונות ולהתווכח על היקף המימוש, בלי להחליף מודל."},{"id":"nov26-1-14","type":"choice","q":"מה נכון לגבי יסודות אזרחיים במודל היהודי האתני־תרבותי הדמוקרטי?","answer":"הם משותפים לכל האזרחים ויכולים להתקיים לצד זהות לאומית יהודית וזכויות קבוצתיות מסוימות","tag":"זכויות קבוצתיות","options":["הם משותפים לכל האזרחים ויכולים להתקיים לצד זהות לאומית יהודית וזכויות קבוצתיות מסוימות","קיומם פירושו שהזהות הלאומית מבוססת על אזרחות בלבד","הם אפשריים רק אם שני הלאומים מקבלים משקל זהותי שווה","הם שוללים הכרה בכל זכות קבוצתית"],"explanation":"אפשר לשלב יסודות אזרחיים משותפים וזכויות קבוצתיות מסוימות בלי לוותר על זהות לאומית יהודית במישור הקולקטיבי."},{"id":"nov26-1-15","type":"blank","q":"לפי המודל היהודי האתני־תרבותי הדמוקרטי, השפה הרשמית המרכזית של המדינה היא ____ .","answer":"עברית","tag":"שפה ותרבות","accept":["העברית"],"explanation":"עברית מוצגת כשפה הרשמית המרכזית, לצד מורשת ישראל ומאפיינים תרבותיים נוספים."}]},{"title":"דת ומדינה: ארבע עמדות","subtitle":"מי מקור הסמכות, ואיזה מקום יש להלכה, למסורת ולפולחן הפרטי.","questions":[{"id":"nov26-2-01","type":"choice","q":"מהו ההבדל העיקרי במקור הסמכות בין מדינת הלכה ובין מדינה המשלבת חקיקה הלכתית חלקית?","answer":"במדינת הלכה המקור הוא ההלכה; במודל החלקי המקור הוא ציבור האזרחים","tag":"מקור הסמכות","options":["במדינת הלכה המקור הוא ההלכה; במודל החלקי המקור הוא ציבור האזרחים","בשני המודלים המקור הוא ציבור האזרחים, אך האכיפה שונה","בשני המודלים המקור הוא ההלכה, אך תחומי החקיקה שונים","במדינת הלכה המקור הוא ציבור האזרחים; במודל החלקי המקור הוא ההלכה"],"explanation":"חקיקה דתית חלקית יכולה להתקיים כשהסמכות מסורה לאזרחים. במדינת הלכה ההלכה היא מקור הסמכות וקובעת את החוקים בכל התחומים."},{"id":"nov26-2-02","type":"blank","q":"במדינת הלכה, מקור הסמכות הוא ____ היהודית.","answer":"ההלכה","tag":"מקור הסמכות","accept":["הלכה"],"explanation":"במודל זה ההלכה היא מקור הסמכות, והחוקים נקבעים על פי דיני התורה בכל תחומי החיים."},{"id":"nov26-2-03","type":"choice","q":"מה משתמע מכך שמחזיקים בעמדת מדינת הלכה חלוקים על אכיפה בבית הפרטי?","answer":"היקף האכיפה יכול להיות שנוי במחלוקת גם כשמקור הסמכות המוסכם הוא ההלכה","tag":"מדינת הלכה","options":["היקף האכיפה יכול להיות שנוי במחלוקת גם כשמקור הסמכות המוסכם הוא ההלכה","אכיפה אחידה בבית הפרטי היא חלק הכרחי מהגדרת העמדה","כל התנגדות לאכיפה בבית הופכת את האזרחים למקור הסמכות","מחלוקת על אכיפה פירושה שהחקיקה ההלכתית נועדה רק למרחב הציבורי"],"explanation":"המסמך מבחין בין מקור החוקים ובין מידת האכיפה בפועל במרחב הביתי. המחלוקת על השנייה אינה משנה את הראשון."},{"id":"nov26-2-04","type":"choice","q":"איזה נימוק מאפיין מדינה המשלבת חקיקה דתית־הלכתית בהיקף חלקי?","answer":"למדינה ערך דתי, ולכן ראוי לשלב בה מרכיבים הלכתיים כשהסמכות מסורה לאזרחים","tag":"חקיקה הלכתית חלקית","options":["למדינה ערך דתי, ולכן ראוי לשלב בה מרכיבים הלכתיים כשהסמכות מסורה לאזרחים","ההלכה היא מקור הסמכות, ולכן כל החוקים צריכים להיקבע על פיה","המורשת ראויה לביטוי תרבותי בלבד, ללא מחויבות להלכה","דת ומורשת אינן עניין של מוסדות המדינה, למעט סמלים"],"explanation":"המודל החלקי רואה ערך דתי במדינה ומבקש שילוב הלכתי מנימוקים דתיים, בלי להעביר את מקור הסמכות מן האזרחים."},{"id":"nov26-2-05","type":"blank","q":"במודל החקיקה ההלכתית החלקית, נישואין וגיור מובאים כדוגמאות לתחום המעמד ____ .","answer":"האישי","tag":"מעמד אישי","accept":["אישי"],"explanation":"המסמך מציין את תחום המעמד האישי, לצד חיזוק האופי הדתי במרחב הציבורי."},{"id":"nov26-2-06","type":"choice","q":"איזה פרט מבדיל את העמדה המסורתית־מורשתית מן העמדה המשלבת הלכה חלקית?","answer":"מתן ביטוי למורשת במובן תרבותי ולאומי מתוך זיקה למסורת, ללא מחויבות להלכה","tag":"מסורת ומורשת","options":["מתן ביטוי למורשת במובן תרבותי ולאומי מתוך זיקה למסורת, ללא מחויבות להלכה","הטענה שציבור האזרחים הוא מקור הסמכות","הכרה בכך שלמורשת יהודית יכול להיות ביטוי במרחב הציבורי","אפשרות לשלב מרכיבים הלכתיים מתוך ערך דתי למדינה"],"explanation":"מקור סמכות אזרחי משותף לשתיהן. ההבדל הוא הבסיס לביטוי היהודי: זיקה תרבותית ומסורתית לעומת שילוב הלכתי משיקולים דתיים."},{"id":"nov26-2-07","type":"choice","q":"מה נכון לגבי פולחן דתי לפי העמדה החילונית של הפרדה מלאה?","answer":"המדינה מאפשרת פולחן פרטי, ואינה מספקת שירותים דתיים","tag":"הפרדת דת ומדינה","options":["המדינה מאפשרת פולחן פרטי, ואינה מספקת שירותים דתיים","המדינה מספקת שירותי דת כל עוד לא נחקקים חוקים דתיים","המדינה אוסרת פולחן פרטי כדי לשמור על ההפרדה","המדינה מחילה הלכה על פולחן פרטי בלבד"],"explanation":"ההפרדה מתייחסת לתפקיד המדינה ולמוסדותיה. היא אינה שוללת מאדם אפשרות לקיים פולחן דתי פרטי."},{"id":"nov26-2-08","type":"blank","q":"לפי עמדת ההפרדה המלאה, הדת והמורשת מופרדות ממוסדות המדינה, למעט ____ .","answer":"סמלים","tag":"הפרדת דת ומדינה","accept":["סמלי המדינה","הסמלים"],"explanation":"סמלים הם החריג המצוין במסמך. גם במודל זה המדינה יכולה להיות יהודית מבחינה לאומית."},{"id":"nov26-2-09","type":"choice","q":"מה נשמר בזהותה של המדינה החילונית לפי המסמך?","answer":"זהות יהודית מבחינה לאומית, לצד הפרדה מלאה בתחום הדת והמורשת למעט סמלים","tag":"הפרדת דת ומדינה","options":["זהות יהודית מבחינה לאומית, לצד הפרדה מלאה בתחום הדת והמורשת למעט סמלים","זהות יהודית הלכתית בכל תחומי החקיקה, ללא שירותי דת","זהות לאומית אזרחית בלבד, כתנאי להפרדת דת ומדינה","זהות קולקטיבית שווה לשני לאומים, כתנאי להפרדה"],"explanation":"העמדה החילונית עוסקת בציר הדתי־תרבותי. בסיכום היא מאפשרת זהות יהודית לאומית, ולכן אין לזהות אותה אוטומטית עם המודל הלאומי האזרחי."},{"id":"nov26-2-10","type":"choice","q":"במדינת הלכה נבחרים נציגי קהילה ומכריעים בסוגיה ברוב קולות. מה עדיין מונע את סיווגה כדמוקרטית במודל שבמסמך?","answer":"ההלכה, ולא ציבור האזרחים, נותרת מקור הסמכות במדינה","tag":"מדינת הלכה","options":["ההלכה, ולא ציבור האזרחים, נותרת מקור הסמכות במדינה","הכרעת רוב אינה יכולה להתקיים במדינה שיש בה יסודות דתיים","בחירת נציגים בקהילה שוללת בהכרח זכויות פרט","קיומם של נציגים מקומיים מחליף את הצורך בחוקים"],"explanation":"המסמך מכיר במאפיינים הלכתיים שיכולים להתיישב עם מאפיינים דמוקרטיים. המאפיין המכריע בסיווג הכולל הוא מקור הסמכות."},{"id":"nov26-2-11","type":"blank","q":"במדינה מסורתית־מורשתית מבטאים את המורשת היהודית מתוך זיקה למסורת, ללא מחויבות ל____ .","answer":"הלכה","tag":"מסורת ומורשת","accept":["ההלכה"],"explanation":"הגישה תומכת בביטוי ציבורי וחקיקתי למורשת במובן תרבותי ולאומי, בלי לחייב את ההלכה כמסגרת."},{"id":"nov26-2-12","type":"choice","q":"כאשר עקרון דתי מתנגש בעקרון דמוקרטי, מה מבקשת הגישה המשלבת חקיקה הלכתית חלקית?","answer":"לחתור לפתרונות בין היסודות","tag":"חקיקה הלכתית חלקית","options":["לחתור לפתרונות בין היסודות","לקבוע מראש שהיסוד הדתי גובר בכל מצב","לבטל את הזיקה הדתית מכל מוסדות המדינה","לשנות את מקור הסמכות להלכה בכל תחומי החיים"],"explanation":"המודל החלקי מכיר במתח ומבקש למצוא לו פתרונות. ההכרה בערך דתי אינה מחייבת להעביר את הסמכות מן האזרחים."},{"id":"nov26-2-13","type":"choice","q":"מהו צמד מנגנונים שמופיע במודל של שילוב הלכה בהיקף חלקי?","answer":"ביטוי הלכתי בעיקר במרחב הציבורי ובמעמד האישי; שילוב המשפט העברי בחקיקה ובפסיקה","tag":"חקיקה הלכתית חלקית","options":["ביטוי הלכתי בעיקר במרחב הציבורי ובמעמד האישי; שילוב המשפט העברי בחקיקה ובפסיקה","הגדרת ההלכה כמקור הסמכות; קביעת כל החוקים על פי דיני התורה","ביטוי למסורת כשיקול תרבותי בלבד; הימנעות ממחויבות להלכה","התרת פולחן פרטי; הימנעות משירותי דת מטעם המדינה"],"explanation":"המודל החלקי שומר על סמכות האזרחים ומשלב תוכן הלכתי בתחומים מסוימים ובמשפט."},{"id":"nov26-2-14","type":"blank","q":"במדינה מסורתית־מורשתית, מקור הסמכות במדינה הוא ציבור ____ .","answer":"האזרחים","tag":"מקור הסמכות","accept":["אזרחים"],"explanation":"אותו מקור סמכות מופיע גם במודל החקיקה החלקית ובמודל ההפרדה, למרות ההבדלים בתפקיד הדת."},{"id":"nov26-2-15","type":"choice","q":"איזו עמדה מעניקה למורשת היהודית ביטוי בחקיקה ובמרחב הציבורי, אך בלי לראות בהלכה מסגרת מחייבת?","answer":"מדינה מסורתית־מורשתית תרבותית","tag":"דת ומדינה","options":["מדינה מסורתית־מורשתית תרבותית","מדינה חילונית בהפרדה מלאה","מדינת הלכה","מדינה המשלבת חקיקה הלכתית חלקית משיקולים דתיים"],"explanation":"הסימן המבדיל הוא ביטוי פעיל של מורשת כתרבות וכמסורת. במודל ההפרדה תפקיד מוסדות המדינה מצומצם יותר; במודל החלקי משלבים תוכן הלכתי מנימוקים דתיים."}]},{"title":"הבחנות קטנות שמשנות את התשובה","subtitle":"השוואה לפי זכויות, הגירה, סמלים, מוסדות והיקף החקיקה.","questions":[{"id":"nov26-3-01","type":"choice","q":"שתי הצעות מבקשות לבטל את חוק השבות. האחת קובעת זהות קולקטיבית שווה לשני לאומים, והשנייה זהות לפי אזרחות בלבד. מה מסווג נכון את ההצעות, לפי הסדר?","answer":"דו־לאומית דמוקרטית; אזרחית דמוקרטית","tag":"הגירה","options":["דו־לאומית דמוקרטית; אזרחית דמוקרטית","אזרחית דמוקרטית; דו־לאומית דמוקרטית","דו־לאומית דמוקרטית; יהודית אתנית־תרבותית דמוקרטית","יהודית אתנית לא דמוקרטית; אזרחית דמוקרטית"],"explanation":"אותו צעד בהגירה יכול להופיע בשני מודלים. המשקל הזהותי השווה לשני לאומים, לעומת אזרחות בלבד, הוא שמבדיל."},{"id":"nov26-3-02","type":"blank","q":"במדינה דו־לאומית דמוקרטית אין חפיפה מלאה בין לאומיות לבין ____ .","answer":"אזרחות","tag":"אזרחות ולאומיות","accept":["האזרחות"],"explanation":"האזרחות משותפת, אך אינה מוחקת את הזהות הלאומית הנבדלת של הקבוצות."},{"id":"nov26-3-03","type":"choice","q":"מוצע להבטיח זכויות אזרח שוות לכל אדם שהוא אזרח. איזה מידע חסר כדי להבחין בין שלוש העמדות הדמוקרטיות בציר הלאומי?","answer":"עם מי המדינה מזוהה במישור הקולקטיבי: לאום אחד, שני לאומים, או ציבור אזרחי אחד","tag":"שוויון","options":["עם מי המדינה מזוהה במישור הקולקטיבי: לאום אחד, שני לאומים, או ציבור אזרחי אחד","האם שוויון זכויות הפרט חל גם על מי שמשתייכים למיעוט","האם לכלל האזרחים יש מעמד אזרחי כלשהו","האם הבחירות מבטאות השתתפות פוליטית"],"explanation":"השוויון האזרחי לבדו אינו מגלה איזו זהות המדינה מבטאת. הבחנה בין המודלים מחייבת לבדוק את המישור הלאומי."},{"id":"nov26-3-04","type":"choice","q":"הצעה דו־לאומית דמוקרטית מבקשת לשנות את היחס לסוכנות היהודית ולקק״ל. מהו השינוי המופיע במסמך?","answer":"ביטול ההכרה במוסדות הציוניים על ידי המדינה","tag":"מוסדות","options":["ביטול ההכרה במוסדות הציוניים על ידי המדינה","השארת ההכרה הקיימת כתנאי לשוויון בין שני הלאומים","שילוב המוסדות בהכרעה ההלכתית על חוקי המדינה","הכרה במוסדות אלה כמוסדות לאומיים של שני העמים"],"explanation":"הסיכום מונה ביטול הכרת המדינה במוסדות הציוניים כאחד המאפיינים בעמדה הדו־לאומית."},{"id":"nov26-3-05","type":"blank","q":"בדיון על המודל הדו־לאומי, לצד קק״ל מוזכרת ____ כמוסד ציוני שהמדינה תבטל את הכרתה בו.","answer":"הסוכנות היהודית","tag":"מוסדות","accept":["סוכנות יהודית","הסוכנות"],"explanation":"ההצעה המתוארת מכוונת להכרה הממלכתית במוסדות הציוניים, ובהם הסוכנות היהודית וקק״ל."},{"id":"nov26-3-06","type":"choice","q":"מה מבדיל בין הגרסה של ״מדינת כל לאומיה״ לבין המודל הדו־לאומי הבסיסי?","answer":"הזדהות קולקטיבית עם כל קבוצה לאומית שתתקיים במדינה, ולא רק עם שני לאומים מסוימים","tag":"דו־לאומיות","options":["הזדהות קולקטיבית עם כל קבוצה לאומית שתתקיים במדינה, ולא רק עם שני לאומים מסוימים","החלפת כלל הזהויות הלאומיות בזהות אזרחית אחת","הרחבת השוויון האישי בלי שום זיהוי לאומי של המדינה","זיהוי המדינה עם העם היהודי בארץ ובתפוצות בלבד"],"explanation":"הגרסה מרחיבה את מספר הקבוצות שהמדינה תזדהה איתן. המודל האזרחי, לעומתה, מגדיר את הזהות הלאומית לפי אזרחות בלבד."},{"id":"nov26-3-07","type":"choice","q":"איזו הבחנה בין המודל הדו־לאומי והמודל האזרחי נכונה לגבי סמלים ומועדים?","answer":"בדו־לאומי מבקשים ביטוי זהותי מקביל לשני הלאומים; באזרחי מבקשים יסודות המשותפים לכל האזרחים בלבד","tag":"סמלים","options":["בדו־לאומי מבקשים ביטוי זהותי מקביל לשני הלאומים; באזרחי מבקשים יסודות המשותפים לכל האזרחים בלבד","בדו־לאומי מבקשים יסודות אזרחיים בלבד; באזרחי נותנים ביטוי שווה לשני הלאומים","בשניהם נדרש ביטוי שווה לשני לאומים, וההבדל היחיד הוא מדיניות ההגירה","בשניהם נדרש ביטוי יהודי בלעדי, וההבדל היחיד הוא שוויון זכויות הפרט"],"explanation":"המודלים נבדלים בתוכן שהסמלים נועדו לייצג: קבוצות לאומיות מוכרות לעומת מכנה אזרחי משותף בלבד."},{"id":"nov26-3-08","type":"blank","q":"הגרסה שמבקשת הזדהות עם כל קבוצה לאומית הקיימת במדינה נקראת ״מדינת כל ____״.","answer":"לאומיה","tag":"דו־לאומיות","accept":["הלאומים שלה","הלאומים"],"explanation":"זהו מודל רב־תרבותי במישור הלאומי, כלומר הכרה קולקטיבית בקבוצות הלאומיות השונות."},{"id":"nov26-3-09","type":"choice","q":"מוצע לשלב את המשפט העברי בחקיקה ובפסיקה משיקולים דתיים, אבל להשאיר את הסמכות בידי האזרחים. איזה מודל מתאים יותר מכל?","answer":"מדינה המשלבת חקיקה הלכתית בהיקף חלקי","tag":"חקיקה הלכתית חלקית","options":["מדינה המשלבת חקיקה הלכתית בהיקף חלקי","מדינה מסורתית־מורשתית ללא מחויבות להלכה","מדינת הלכה שמקור סמכותה בדיני התורה","מדינה חילונית בהפרדה מלאה"],"explanation":"ההצעה מתאימה לשילוב הלכתי חלקי: מדובר ברכיב משפטי בעל נימוק דתי, בתוך מסגרת שמקור סמכותה אזרחי."},{"id":"nov26-3-10","type":"choice","q":"מחוקקת מבקשת להסדיר פעילות ציבורית המשמרת מורשת יהודית מתוך שיקול תרבותי, ללא חובה לנהוג לפי ההלכה. במה שונה ההצעה מהפרדה מלאה?","answer":"היא נותנת למוסדות המדינה תפקיד פעיל בביטוי המורשת בחקיקה ובמרחב הציבורי","tag":"מסורת ומורשת","options":["היא נותנת למוסדות המדינה תפקיד פעיל בביטוי המורשת בחקיקה ובמרחב הציבורי","היא מעבירה את מקור הסמכות מן האזרחים אל ההלכה","היא מבטלת את חריג הסמלים בכל ביטוי למורשת","היא מסתפקת במתן אפשרות לקיום פולחן דתי פרטי"],"explanation":"העמדה המורשתית מבקשת מעורבות ממשית בביטוי התרבותי. לפי ההפרדה המלאה הדת והמורשת מופרדות מהמוסדות הפוליטיים, למעט סמלים."},{"id":"nov26-3-11","type":"blank","q":"אחת הדרכים לביטוי הלכתי חלקי היא שילוב המשפט העברי בחקיקה וב____ .","answer":"פסיקה","tag":"חקיקה הלכתית חלקית","accept":["הפסיקה"],"explanation":"במודל החלקי השילוב יכול להיות הן בקביעת חוקים והן בפסיקת בתי המשפט, לפי הסיכום."},{"id":"nov26-3-12","type":"choice","q":"למה האמירה ״כל אדם נברא בצלם״ אינה מספיקה כשלעצמה כדי לקבוע שמדינת הלכה היא דמוקרטיה?","answer":"היא עשויה להתיישב עם שוויון וכבוד, אך אינה קובעת מי מקור סמכות המדינה","tag":"מדינת הלכה","options":["היא עשויה להתיישב עם שוויון וכבוד, אך אינה קובעת מי מקור סמכות המדינה","היא מדגימה שההלכה שוללת הכרה בכבוד האדם","היא מוכיחה שכללי המדינה נקבעים על ידי כלל האזרחים","היא מלמדת בהכרח על הפרדה מלאה בין מוסדות המדינה והדת"],"explanation":"המסמך מבחין בין התאמה של מאפיין מסוים לערך דמוקרטי ובין מקור הסמכות של המודל כולו."},{"id":"nov26-3-13","type":"choice","q":"איזה משפט מבחין נכון בין ״יש יסודות אזרחיים משותפים״ לבין ״זהות לאומית אזרחית בלבד״?","answer":"יסודות משותפים יכולים להופיע בכמה מודלים; זהות לאומית אזרחית בלבד היא מאפיין מגדיר של המודל האזרחי","tag":"אזרחות ולאומיות","options":["יסודות משותפים יכולים להופיע בכמה מודלים; זהות לאומית אזרחית בלבד היא מאפיין מגדיר של המודל האזרחי","שני הביטויים מתארים בהכרח זהות קולקטיבית אזרחית בלבד","יסודות משותפים מאפיינים מודל דו־לאומי בלבד, ואילו זהות אזרחית מאפיינת מודל יהודי דמוקרטי","יסודות משותפים קיימים רק כשכל הקבוצות הלאומיות מקבלות משקל זהה"],"explanation":"חינוך או מוסדות אזרחיים משותפים אינם מחייבים שציבור האזרחים הוא הלאום היחיד של המדינה. זהו הבדל בין מאפיין משותף לבסיס הזהות."},{"id":"nov26-3-14","type":"blank","q":"״אחרי רבים להטות״ מוצג במסמך כמאפיין הלכתי שיכול לעלות בקנה אחד עם עקרון ____ .","answer":"הכרעת הרוב","tag":"מדינת הלכה","accept":["הכרעת רוב"],"explanation":"הדוגמה מתייחסת להכרעה לפי הרוב. היא אינה משנה את העובדה שההלכה היא מקור הסמכות במדינת הלכה."},{"id":"nov26-3-15","type":"choice","q":"איזו הבחנה בין מחלוקות פנימיות בשני מודלים מדויקת?","answer":"במדינת הלכה עשויה להיות מחלוקת על אכיפה בבית; במודל היהודי הדמוקרטי עשויה להיות מחלוקת על היקף ביטוי התרבות","tag":"רצף דעות","options":["במדינת הלכה עשויה להיות מחלוקת על אכיפה בבית; במודל היהודי הדמוקרטי עשויה להיות מחלוקת על היקף ביטוי התרבות","במדינת הלכה המחלוקת היא מי מקור הסמכות; במודל היהודי הדמוקרטי כולם מסכימים על אופן המימוש","במדינת הלכה כולם חייבים להסכים על אכיפה בבית; במודל היהודי הדמוקרטי אין בסיס עקרוני משותף","בשני המודלים כל מחלוקת על יישום מעבירה את התומכים למודל אחר"],"explanation":"העמדות מתארות עקרונות יסוד, אך המסמך מכיר ברצף דעות על דרכי יישום בתוך כל אחת משתי העמדות הללו."}]},{"title":"מקרי בוחן: לזהות ולהסביר","subtitle":"מצבים חדשים שבהם צריך לזהות את המודל ואת הפרט שמכריע.","questions":[{"id":"nov26-4-01","type":"choice","q":"בהצעת חוקה יש זכות עלייה ליהודים, סמלים המבטאים את מורשת ישראל וזכות הצבעה שווה לכל האזרחים. ההצעה מתחייבת לשוויון זכויות מלא. איזו עמדה מתאימה?","answer":"מדינת לאום יהודית אתנית־תרבותית דמוקרטית","tag":"זהות לאומית","options":["מדינת לאום יהודית אתנית־תרבותית דמוקרטית","מדינת לאום יהודית אתנית לא דמוקרטית","מדינה דו־לאומית דמוקרטית","מדינת לאום אזרחית דמוקרטית"],"explanation":"שילוב הזיקה הלאומית היהודית והעדפה בעלייה עם ריבונות אזרחית ושוויון זכויות מתאים למודל היהודי הדמוקרטי."},{"id":"nov26-4-02","type":"choice","q":"הצעה משמרת זיקה יהודית וסמלים יהודיים, אך מוסיפה שבכל התנגשות עם שוויון אזרחי, הזהות היהודית גוברת מראש. מהו הפרט המכריע בסיווג?","answer":"הכרעה מראש לטובת היסוד היהודי בכל מתח","tag":"זהות לאומית","options":["הכרעה מראש לטובת היסוד היהודי בכל מתח","קיומם של סמלים הנותנים ביטוי למורשת יהודית","עצם הדיון בשאלה כיצד לבטא את הזהות היהודית","קיומה של זהות יהודית במישור הלאומי"],"explanation":"סמלים וזיקה יהודית קיימים גם במודל היהודי הדמוקרטי. עדיפות קבועה מראש ואי־מחויבות הכרחית לשוויון מלא מבדילות את העמדה הלא דמוקרטית."},{"id":"nov26-4-03","type":"blank","q":"בעמדה היהודית האתנית־תרבותית הדמוקרטית, הגדרה עצמית לאומית יהודית מתקיימת לצד שוויון ____ בין כל האזרחים.","answer":"מלא","tag":"שוויון","accept":["זכויות מלא"],"explanation":"השוויון במישור זכויות הפרט חל ללא הבדלי השתייכות לאומית, אתנית או דתית."},{"id":"nov26-4-04","type":"choice","q":"מועצה חוקתית מציעה המנון וסמל שיבטאו זהות יהודית וערבית במשקל שווה, אף ששתי הקבוצות חולקות אזרחות משותפת. איזו עמדה מוצגת?","answer":"מדינה דו־לאומית דמוקרטית","tag":"דו־לאומיות","options":["מדינה דו־לאומית דמוקרטית","מדינת לאום אזרחית דמוקרטית","מדינת לאום יהודית אתנית־תרבותית דמוקרטית","מדינת לאום יהודית אתנית לא דמוקרטית"],"explanation":"אזרחות משותפת אינה שקולה לזהות אזרחית בלבד. המשקל הזהותי השווה לשני לאומים מצביע על המודל הדו־לאומי."},{"id":"nov26-4-05","type":"choice","q":"מצע מבקש לבטל העדפה של קבוצה כלשהי בהגירה. הוא מוסיף שסמלי המדינה יבטאו אך ורק יסודות אזרחיים משותפים. מה מצביע דווקא על המודל האזרחי?","answer":"הגבלת הסמלים והזהות הקולקטיבית ליסודות אזרחיים משותפים בלבד","tag":"לאומיות אזרחית","options":["הגבלת הסמלים והזהות הקולקטיבית ליסודות אזרחיים משותפים בלבד","ביטול ההעדפה בהגירה, בלי מידע נוסף על הזהות","הקיום של יסודות אזרחיים משותפים, בלי לקבוע אם הם היחידים","ההכרה בכך שבמדינה קיימות קבוצות תרבותיות שונות"],"explanation":"מדיניות הגירה שוויונית יכולה להתאים גם למודל הדו־לאומי. המילה ״בלבד״ לגבי בסיס אזרחי היא הפרט שמכריע כאן."},{"id":"nov26-4-06","type":"blank","q":"בהצעה הדו־לאומית, המסמך דורש שינוי בדגל, בסמלים וב____ כדי לתת גם לזהות הערבית משקל שווה.","answer":"המנון","tag":"מוסדות","accept":["המנונה","המנון המדינה","ההמנון"],"explanation":"ההצעה כוללת שינוי במספר סמלים לאומיים, ובהם ההמנון, כדי לבטא את שתי הזהויות."},{"id":"nov26-4-07","type":"choice","q":"במדינה מוצעת מתקיימת בחירת נציגים בקהילה, אבל חוקי המדינה בכל התחומים נקבעים לפי דיני התורה ומקור הסמכות הוא ההלכה. מהו המודל הדתי־תרבותי?","answer":"מדינת הלכה","tag":"מקור הסמכות","options":["מדינת הלכה","מדינה המשלבת חקיקה הלכתית חלקית","מדינה מסורתית־מורשתית תרבותית","מדינה חילונית בהפרדה מלאה"],"explanation":"בחירת נציגים בקהילה אינה הופכת את ציבור האזרחים למקור הסמכות. כאן ההלכה קובעת את מסגרת כל החקיקה."},{"id":"nov26-4-08","type":"choice","q":"הפרלמנט שואב את סמכותו מן האזרחים. הוא מבקש לתת להלכה תפקיד בחקיקה הנוגעת לכשרות ונישואין מפני שלמדינה ערך דתי. מהו המודל המתאים?","answer":"מדינה המשלבת חקיקה הלכתית בהיקף חלקי","tag":"חקיקה הלכתית חלקית","options":["מדינה המשלבת חקיקה הלכתית בהיקף חלקי","מדינה מסורתית־מורשתית תרבותית","מדינת הלכה","מדינה חילונית בהפרדה מלאה"],"explanation":"הנימוק הדתי והתחומים המוגדרים מצביעים על שילוב הלכתי חלקי. מקור הסמכות האזרחי מבדיל אותו ממדינת הלכה."},{"id":"nov26-4-09","type":"blank","q":"נבחרי הציבור מבקשים לשלב בחקיקה כללים הלכתיים בעיקר במרחב הציבורי ובתחום ____ .","answer":"המעמד האישי","tag":"חקיקה הלכתית חלקית","accept":["מעמד אישי","מעמד האישי"],"explanation":"המסמך מציין את המרחב הציבורי ואת המעמד האישי כתחומים מרכזיים לביטוי האופי היהודי הדתי במודל החלקי."},{"id":"nov26-4-10","type":"choice","q":"עיר מקדמת בחקיקה המקומית אירועי מורשת יהודית במרחב הציבורי. המטרה היא לטפח מסורת לאומית ותרבותית, ואין דרישה לנהוג לפי ההלכה. איזו עמדה משתקפת בנימוק?","answer":"מסורתית־מורשתית תרבותית","tag":"מסורת ומורשת","options":["מסורתית־מורשתית תרבותית","חילונית בהפרדה מלאה","שילוב חקיקה הלכתית חלקית משיקולים דתיים","מדינת הלכה"],"explanation":"השיקול המכריע הוא טיפוח מורשת בלי מחויבות הלכתית. הפעולה נעשית במוסד ציבורי, מעבר להתרת פולחן פרטי בלבד."},{"id":"nov26-4-11","type":"choice","q":"מצע משאיר סמלים יהודיים לאומיים ומאפשר קיום טקסים פרטיים, אך מתנגד לכך שהמדינה תחוקק חוקים דתיים או תעניק שירותי דת. מה מתאים?","answer":"מדינה חילונית בהפרדה מלאה בין דת למדינה","tag":"הפרדת דת ומדינה","options":["מדינה חילונית בהפרדה מלאה בין דת למדינה","מדינה מסורתית־מורשתית תרבותית","מדינה המשלבת חקיקה הלכתית חלקית","מדינת הלכה"],"explanation":"הסמלים הם החריג המפורש במודל ההפרדה. קיום פרטי של פולחן מותר, ואילו שירותי דת אינם מתפקיד המדינה."},{"id":"nov26-4-12","type":"blank","q":"הצעה שמחייבת לקבוע את כל חוקי המדינה לפי דיני התורה רואה בהלכה את מקור ה____ של המדינה.","answer":"סמכות","tag":"מקור הסמכות","accept":["הסמכות"],"explanation":"מקור הסמכות, ולא מידת האכיפה בבית, מבדיל את מדינת ההלכה משלוש העמדות האחרות בציר הדתי."},{"id":"nov26-4-13","type":"choice","q":"דוברת תומכת במדינת לאום יהודית, בשוויון מלא בין האזרחים ובשילוב הלכה חלקי בחקיקה משיקולים דתיים. איך כדאי לסווג את דבריה?","answer":"יהודית אתנית־תרבותית דמוקרטית בציר הלאומי; שילוב הלכתי חלקי בציר הדתי","tag":"שני צירי הזהות","options":["יהודית אתנית־תרבותית דמוקרטית בציר הלאומי; שילוב הלכתי חלקי בציר הדתי","יהודית אתנית לא דמוקרטית בציר הלאומי; מדינת הלכה בציר הדתי","אזרחית דמוקרטית בציר הלאומי; שילוב הלכתי חלקי בציר הדתי","דו־לאומית דמוקרטית בציר הלאומי; מסורתית־מורשתית בציר הדתי"],"explanation":"זהות יהודית וזכויות שוות עונות לציר הלאומי. היקף החקיקה ההלכתית והנימוק הדתי עונים לציר הדתי־תרבותי."},{"id":"nov26-4-14","type":"choice","q":"בתרחיש נאמר רק שחלק ממועדי המדינה יהודיים. מה תהיה תשובה מנומקת טובה על הציר הלאומי?","answer":"המועדים מלמדים על ביטוי ליהדות, אך נדרש מידע על זכויות וזהות קולקטיבית כדי להכריע בין המודלים","tag":"ראיה ונימוק","options":["המועדים מלמדים על ביטוי ליהדות, אך נדרש מידע על זכויות וזהות קולקטיבית כדי להכריע בין המודלים","המועדים מספיקים כדי לקבוע שהעמדה היא יהודית אתנית לא דמוקרטית","המועדים מספיקים כדי לקבוע שהעמדה היא יהודית דמוקרטית","המועדים מלמדים שאין לזהות היהודית שום מקום במישור הקולקטיבי"],"explanation":"אותו פרט עשוי להתאים ליותר ממודל אחד. תשובה טובה תוסיף ראיה שמבחינה ביניהם, כגון התחייבות לשוויון או הכרעה קבועה במתח."},{"id":"nov26-4-15","type":"blank","q":"לפי מודל ההפרדה המלאה, המדינה אינה מספקת שירותי דת, אך מאפשרת פולחן דתי ____ .","answer":"פרטי","tag":"הפרדת דת ומדינה","accept":["במרחב הפרטי"],"explanation":"המדינה אינה מתערבת בענייני דת לפי מודל זה, אך היא מאפשרת לפרט לקיים פולחן."}]},{"title":"סימולציה מסכמת","subtitle":"ערבוב בין הצירים, מסיחים קרובים ושאלות שמבקשות להוכיח את הסיווג.","questions":[{"id":"nov26-5-01","type":"choice","q":"הצעה א׳ מבטיחה ייצוג לאומי שווה ליהודים ולערבים. הצעה ב׳ מבטיחה זכויות שוות, אך נותנת למדינה זיקה לאומית יהודית והעדפה ליהודים בהגירה. מה מבדיל ביניהן?","answer":"המשקל שניתן לכל לאום בזהות הקולקטיבית, ולא עצם ההבטחה לשוויון אישי","tag":"שני צירי הזהות","options":["המשקל שניתן לכל לאום בזהות הקולקטיבית, ולא עצם ההבטחה לשוויון אישי","עצם השימוש בהגירה כנושא לחקיקה, בלי קשר לזהות","קיומה של ריבונות אזרחית בהצעה א׳ והיעדרה בהצעה ב׳","קיומם של יסודות אזרחיים משותפים רק בהצעה ב׳"],"explanation":"א׳ היא דו־לאומית וב׳ מתאימה למדינה יהודית דמוקרטית. שוויון זכויות הפרט אינו דורש בהכרח משקל שווה לשני הלאומים בזהות המדינה."},{"id":"nov26-5-02","type":"blank","q":"במודל היהודי הדמוקרטי ובמודל הדו־לאומי אין ____ מלאה בין לאומיות לאזרחות.","answer":"חפיפה","tag":"אזרחות ולאומיות","accept":[],"explanation":"בשניהם האזרחות והלאומיות אינן מושגים זהים. במודל האזרחי הדמוקרטי קיימת חפיפה מלאה."},{"id":"nov26-5-03","type":"choice","q":"שתי מחוקקות מסכימות שלמורשת יהודית יהיה מקום בחוק ושציבור האזרחים הוא מקור הסמכות. איזו שאלה תעזור להבחין בין המודל המורשתי למודל ההלכתי החלקי?","answer":"האם מבקשים ביטוי תרבותי מתוך זיקה למסורת, או שילוב הלכתי משיקולים דתיים?","tag":"מסורת ומורשת","options":["האם מבקשים ביטוי תרבותי מתוך זיקה למסורת, או שילוב הלכתי משיקולים דתיים?","האם יש ציבור אזרחים שרשאי להשתתף בבחירות?","האם יש איזושהי זיקה למורשת יהודית בחוק ובציבור?","האם הטקסים בבית הפרטי מתקיימים באישור של נבחרי ציבור?"],"explanation":"שני המודלים יכולים לתת ביטוי ליהדות ולשמור על מקור סמכות אזרחי. הנימוק והמעמד שניתן להלכה הם המבדילים."},{"id":"nov26-5-04","type":"choice","q":"דובר טוען: ״אם במדינה יש זכות עלייה ליהודים, היא לא יכולה להתחייב לשוויון מלא בין האזרחים״. מהי התשובה המדויקת לפי המודל היהודי הדמוקרטי?","answer":"מדיניות ההגירה והזכויות של כלל האזרחים הן שני מישורים נפרדים","tag":"הגירה","options":["מדיניות ההגירה והזכויות של כלל האזרחים הן שני מישורים נפרדים","העדפה בהגירה מחייבת זכויות פוליטיות שונות אחרי קבלת האזרחות","שוויון זכויות של אזרחים מחייב זיהוי שווה של שני לאומים","שוויון זכויות אפשרי רק כשלאומיות ואזרחות חופפות במלואן"],"explanation":"המודל משלב העדפה לאומית בהגירה והגדרה עצמית יהודית עם שוויון מלא בזכויות האזרח לאחר קבלת האזרחות."},{"id":"nov26-5-05","type":"blank","q":"בעמדה היהודית הדמוקרטית, אחד הביטויים המרכזיים לריבונות הדמוס הוא הבחירות ל____ .","answer":"כנסת","tag":"ריבונות","accept":["הכנסת"],"explanation":"המסמך מציין את הבחירות לכנסת לצד שאר זכויות האזרח כביטוי לריבונות כלל האזרחים."},{"id":"nov26-5-06","type":"choice","q":"לפי המסמך, איזו מסקנה אינה נובעת מעצם ההגדרה ״מדינה יהודית מבחינה לאומית״?","answer":"שמקור הסמכות הוא ההלכה היהודית","tag":"שני צירי הזהות","options":["שמקור הסמכות הוא ההלכה היהודית","שניתן להבחין בין זהות לאומית למדיניות דתית","שזהות לאומית יהודית יכולה להתקיים עם הפרדת דת ומדינה","שהגדרה לאומית אינה מספיקה לבדה כדי לקבוע את תפקיד הדת בחוק"],"explanation":"המודל החילוני בסיכום מדגים מדינה יהודית מבחינה לאומית שמקור סמכותה האזרחים. לכן יהדות לאומית אינה הופכת את ההלכה למקור הסמכות."},{"id":"nov26-5-07","type":"choice","q":"בהצעת חוקה א׳ שתי קבוצות לאומיות זוכות למשקל קולקטיבי שווה. בהצעה ב׳ כל קבוצת לאום הקיימת במדינה מוכרת כחלק מזהותה. מהו ההבדל המדויק?","answer":"ב׳ מרחיבה את מעגל ההזדהות הלאומית מעבר לצמד הקבוצות שבהצעה א׳","tag":"דו־לאומיות","options":["ב׳ מרחיבה את מעגל ההזדהות הלאומית מעבר לצמד הקבוצות שבהצעה א׳","ב׳ מוותרת על כל הכרה בזהויות לאומיות לטובת לאום אזרחי אחד","ב׳ מעניקה זכויות אישיות, אך אינה עוסקת כלל בזהות המדינה","ב׳ מוסיפה העדפת הגירה ליהודים כדי לאזן בין שתי קבוצות"],"explanation":"זהו ההבדל בין מודל דו־לאומי לבין גרסת ״כל לאומיה״. בשניהם מדובר בזיקה קולקטיבית, לא רק בזכויות פרט."},{"id":"nov26-5-08","type":"blank","q":"במדינת הלכה החוקים נקבעים על פי דיני התורה בכל ____ החיים.","answer":"תחומי","tag":"מדינת הלכה","accept":["תחום","תחומי החיים"],"explanation":"כל תחומי החיים נכללים במקור החקיקה. המחלוקת האפשרית נוגעת למידת האכיפה בפועל בבית הפרטי."},{"id":"nov26-5-09","type":"choice","q":"איזה נימוק הוא החזק ביותר לסיווג הצעה כמדינת לאום אזרחית דמוקרטית?","answer":"״החוקה מגדירה את הלאום על בסיס אזרחות ישראלית בלבד; לכן לאומיות ואזרחות חופפות.״","tag":"ראיה ונימוק","options":["״החוקה מגדירה את הלאום על בסיס אזרחות ישראלית בלבד; לכן לאומיות ואזרחות חופפות.״","״יש לכלל האזרחים מוסדות משותפים; לכן המודל אינו מכיר בשום לאום אחר.״","״חוק השבות יבוטל; לכן המודל לא יכול להיות דו־לאומי.״","״מתקיימות בחירות שוות; לכן זהות לאומית אתנית אינה אפשרית.״"],"explanation":"התשובה מחברת ראיה מהתרחיש למאפיין מגדיר. יתר הפרטים יכולים להופיע ביותר ממודל אחד."},{"id":"nov26-5-10","type":"choice","q":"מה משקפת ההתאמה בין שלוש הדוגמאות ההלכתיות לבין העקרונות הדמוקרטיים המקבילים במסמך?","answer":"אחרי רבים להטות — הכרעת רוב; נברא בצלם — שוויון וכבוד; בחירת נציגי קהילה — שלטון העם","tag":"מדינת הלכה","options":["אחרי רבים להטות — הכרעת רוב; נברא בצלם — שוויון וכבוד; בחירת נציגי קהילה — שלטון העם","אחרי רבים להטות — שוויון וכבוד; נברא בצלם — שלטון העם; בחירת נציגים — הכרעת רוב","אחרי רבים להטות — שלטון העם; נברא בצלם — הכרעת רוב; בחירת נציגים — שוויון וכבוד","כל שלוש הדוגמאות משקפות רק הכרעת רוב, ללא קשר לעקרונות אחרים"],"explanation":"המסמך מציג דמיון בין מאפיינים מסוימים. הוא מבחין בין הדמיון הזה לבין ההלכה כמקור הסמכות הכולל."},{"id":"nov26-5-11","type":"blank","q":"לפי המודל החילוני של הפרדה מלאה, המדינה יכולה להישאר יהודית מבחינה ____ .","answer":"לאומית","tag":"הפרדת דת ומדינה","accept":["לאום"],"explanation":"ההפרדה במודל מתייחסת לדת ולמורשת ביחס למוסדות המדינה, עם חריג לסמלים. היא אינה מחייבת שינוי של הזהות הלאומית היהודית."},{"id":"nov26-5-12","type":"choice","q":"בהצעה יהודית דמוקרטית יש סמלים יהודיים, שוויון אישי וגם זכויות קבוצתיות מסוימות למיעוטים. למה זה אינו מספיק כדי לקרוא לה ״דו־לאומית״?","answer":"זכויות קבוצתיות מסוימות אינן שקולות להזדהות קולקטיבית שווה של המדינה עם שני לאומים","tag":"זכויות קבוצתיות","options":["זכויות קבוצתיות מסוימות אינן שקולות להזדהות קולקטיבית שווה של המדינה עם שני לאומים","הכרה בזכויות קבוצתיות מחייבת הגדרה לאומית אזרחית בלבד","סמלים לאומיים לעולם אינם משמשים להבחנה בין שתי העמדות","זכויות קבוצתיות מחייבות ביטול ההעדפה בהגירה ליהודים"],"explanation":"ההכרה בזכויות לקבוצה אינה מעניקה לה בהכרח מעמד שווה בזהות הקולקטיבית של המדינה."},{"id":"nov26-5-13","type":"choice","q":"הצעה אחת מחייבת שכל החוק ייקבע לפי ההלכה. הצעה אחרת מחייבת שהיסוד היהודי יגבר בכל התנגשות עם היסוד הדמוקרטי, בלי לציין מקור סמכות הלכתי. כיצד נכון לסווג?","answer":"הראשונה מצביעה על מדינת הלכה בציר הדתי; השנייה על עמדה יהודית אתנית לא דמוקרטית בציר הלאומי","tag":"שני צירי הזהות","options":["הראשונה מצביעה על מדינת הלכה בציר הדתי; השנייה על עמדה יהודית אתנית לא דמוקרטית בציר הלאומי","שתיהן מוכיחות מדינת הלכה בציר הדתי, בלי צורך לבדוק את מקור הסמכות","שתיהן מוכיחות מדינת לאום אזרחית, מפני שהן מתארות כללים לחקיקה","הראשונה מצביעה על מודל מורשתי; השנייה בהכרח על חקיקה הלכתית חלקית"],"explanation":"מקור סמכות הלכתי והכרעה קבועה לטובת היסוד היהודי הם פרטים השייכים לשני צירים שונים; אין להסיק את האחד מן האחר בלי ראיה."},{"id":"nov26-5-14","type":"blank","q":"לפי המודל המשלב חקיקה הלכתית חלקית, כאשר נוצר מתח בין היסוד הדתי ליסוד הדמוקרטי יש לחתור ל____ ביניהם.","answer":"פתרונות","tag":"חקיקה הלכתית חלקית","accept":["פתרון","מציאת פתרונות","פתרונות שונים"],"explanation":"המודל מכיר במתח ומחפש דרכים להתמודד איתו, בלי לקבוע מראש שהצד הדתי תמיד גובר."},{"id":"nov26-5-15","type":"choice","q":"שני מצעים מכירים בזיקה לאומית לעם היהודי, בשוויון מלא ובזכות עלייה. האחד מעניק יותר מקום לתרבויות אחרות במרחב הציבורי. האם בהכרח מדובר בשתי עמדות לאומיות שונות?","answer":"לא. ייתכן ששניהם באותה עמדה וההבדל הוא בהיקף המימוש","tag":"רצף דעות","options":["לא. ייתכן ששניהם באותה עמדה וההבדל הוא בהיקף המימוש","כן. כל הכרה בתרבויות אחרות הופכת את המדינה לדו־לאומית","כן. אין מקום למחלוקת על יישום בתוך העמדה היהודית הדמוקרטית","לא. מידת הייצוג במרחב הציבורי אינה יכולה להיות שנויה במחלוקת"],"explanation":"לפי המסמך, שותפות בעקרונות יכולה להתקיים לצד הבדלים משמעותיים בהיקף המימוש. מה שקובע את המודל הוא המחויבות לעקרונות המגדירים."}]}]</script>

function bindBlankForm(q){

  if(!form)return;

  input.oninput=()=>{
    if(session.mode==='exam'){
      if(input.value.trim())session.answers[q.id]=input.value.trim();
      else delete session.answers[q.id];
    }else (session.drafts??={})[q.id]=input.value;

    persist();renderQuestion();
  };

      const blanks=set.questions.filter(q=>q.type==='blank').length;
      return `<section class="card"><div class="num">מבחן ${i+1} · ${set.questions.length} שאלות</div>
        <h2>${esc(set.title)}</h2><p class="muted">${esc(set.subtitle)}</p>
        <span class="badge">${set.questions.length-blanks} בחירה · ${blanks} השלמה</span>
        ${last?`<span class="badge">ציון אחרון: ${last.score}</span>`:''}
        <div class="actions"><button class="btn primary" data-nov-start="${i}">התחלת המבחן ←</button></div></section>`;
    }).join('')}</div>
    <div class="actions"><button class="btn" id="nov-blanks" ${keyTerms.length?'':'disabled'}>תרגול מושגים בהשלמה</button>
    <button class="btn" id="nov-wrong" ${wrong.length?'':'disabled'}>חזרה על טעויות (${wrong.length})</button></div>
    <footer>ההתקדמות נשמרת בדפדפן הזה. בסיום כל מבחן אפשר לחזור על שאלות שבהן טעית ולזהות נושאים לחיזוק.</footer>`;
  const modeControl=document.getElementById('nov-mode'),mixControl=document.getElementById('nov-mix');
  modeControl.value=mode;modeControl.onchange=e=>mode=e.target.value;
  mixControl.checked=mix;mixControl.onchange=e=>mix=e.target.checked;
  app.querySelectorAll('[data-nov-start]').forEach(b=>b.onclick=()=>start(+b.dataset.novStart));
  const resume=document.getElementById('nov-resume');
  if(resume)resume.onclick=()=>{location.hash=quizPath();renderQuestion()};
  document.getElementById('nov-wrong').onclick=()=>{mode='practice';start(-2,wrong)};
  document.getElementById('nov-blanks').onclick=()=>{mode='practice';start(-1,shuffle(keyTerms).slice(0,15),'תרגול מושגים בהשלמה')};
}

addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
