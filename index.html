function childPlaceholder(name){app.innerHTML=crumbs([[name]])+`<section class="card empty"><span class="badge">בהמשך</span><h1>${name}</h1><p class="muted">כאן יתווספו המקצועות והתרגולים שלך.</p><a class="btn" href="#/">חזרה לבחירת תלמיד</a></section>`+foot()}
function subject(){app.innerHTML=crumbs([['Adar','#/adar'],['אזרחות']])+`<div class="eyebrow">אזרחות</div><h1>מבינים את המושג.<br>מזהים אותו במציאות.</h1><p class="intro">בחרי את המבחן שאליו את מתכוננת.</p><div class="grid"><a class="card link" href="#/adar/civics/october-27"><span class="badge">4 בחנים · 15 שאלות בכל בוחן</span><h3>הכנה למבחן אוקטובר 27</h3><p class="muted">דמוקרטיה, שלטון החוק, הכרזת העצמאות, זכויות, שוויון וגישות כלכליות.</p><strong>מתחילים לתרגל ←</strong></a></div>`+foot()}
function menu(){let wrong=saved.wrong.length;app.innerHTML=crumbs([...civ,['הכנה למבחן אוקטובר 27']])+`<div class="eyebrow">60 שאלות · ארבעה צעדים</div><h1>מוכנה למבחן?</h1><p class="intro">בכל בוחן שאלות ידע ותרחישים. קראי את הפרט שמבדיל בין המושגים, ואז בחרי את התשובה המדויקת ביותר.</p><div class="settings"><label>מצב <select id="mode"><option value="practice">תרגול — הסבר מיד אחרי תשובה</option><option value="exam">מבחן — תוצאות רק בסיום</option></select></label><label><input id="mix" type="checkbox" checked> ערבוב סדר השאלות</label></div>${session&&!session.finished?`<div class="notice">יש לך בוחן בתהליך. <button class="btn" id="resume">המשך מאיפה שעצרתי</button></div>`:''}<div class="grid">${sets.map((s,i)=>{let runs=saved.history.filter(h=>h.set===i);return `<section class="card"><div class="num">בוחן ${['א׳','ב׳','ג׳','ד׳'][i]} · 15 שאלות</div><h3>${s.title}</h3><p class="muted">${s.subtitle}</p>${runs.length?`<span class="badge">הציון האחרון: ${runs.at(-1).score}</span>`:''}<div class="actions"><button class="btn primary" data-start="${i}">התחלת הבוחן ←</button></div></section>`}).join('')}</div><div class="actions"><button class="btn" id="mixed">בוחן מעורב · 15 שאלות מכל הנושאים</button><button class="btn" id="mistakes" ${wrong?'':'disabled'}>חזרה על טעויות (${wrong})</button></div><div class="notice">סדר התשובות מתערבב בכל ניסיון. במצב מבחן אפשר לדלג, לחזור ולשנות תשובות עד להגשה.</div>`+foot();document.getElementById('mode').value=mode;document.getElementById('mix').checked=mix;document.getElementById('mode').onchange=e=>mode=e.target.value;document.getElementById('mix').onchange=e=>mix=e.target.checked;app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(+b.dataset.start));if(document.getElementById('resume'))document.getElementById('resume').onclick=()=>{location.hash='#/quiz';renderQuestion()};document.getElementById('mixed').onclick=()=>start(-1,shuffle(all).slice(0,15));document.getElementById('mistakes').onclick=()=>start(-2,all.filter(q=>saved.wrong.includes(q.id)))}
function start(i,qs){if(session&&!session.finished&&!confirm('להתחיל בוחן חדש במקום הבוחן שבתהליך?'))return;qs=qs||sets[i].questions;session={set:i,title:i>=0?sets[i].title:i===-1?'בוחן מעורב':'חזרה על טעויות',mode,questions:(mix?shuffle(qs):[...qs]).map(q=>({...q,options:shuffle(q.options)})),answers:{},index:0,finished:false,started:Date.now()};persist();location.hash='#/quiz';renderQuestion()}
function renderQuestion(){if(!session){location.hash='#/adar/civics/october-27';return}if(session.finished){results();return}let qs=session.questions,q=qs[session.index],chosen=session.answers[q.id],revealed=session.mode==='practice'&&chosen!==undefined,answered=Object.keys(session.answers).length;app.innerHTML=crumbs([...exam,[session.title]])+`<div class="topline"><strong>${esc(session.title)} · ${session.mode==='practice'?'תרגול':'מבחן'}</strong><span>שאלה ${session.index+1} מתוך ${qs.length} · נענו ${answered}</span></div><div class="progress" role="progressbar" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="${qs.length}" aria-label="שאלות שנענו"><i style="width:${answered/qs.length*100}%"></i></div><section class="question"><div class="eyebrow">בחרי את התשובה המדויקת ביותר</div><h2>${esc(q.q)}</h2><div class="answers">${q.options.map((o,i)=>`<button class="answer ${o===chosen?'selected ':''}${revealed&&o===q.answer?'correct':revealed&&o===chosen?'wrong':''}" data-option="${i}" ${revealed?'disabled':''} aria-pressed="${o===chosen}"><b>${['א','ב','ג','ד'][i]}</b><span>${esc(o)}${revealed&&o===q.answer?' ✓':''}${revealed&&o===chosen&&o!==q.answer?' ✕':''}</span></button>`).join('')}</div>${revealed?`<div class="feedback ${chosen===q.answer?'':'error'}" role="status"><strong>${chosen===q.answer?'נכון — זיהית את המאפיין המרכזי.':'כדאי לדייק: '+esc(q.answer)}</strong><p>${esc(q.explanation)}</p><div class="badge">${esc(q.tag)}</div></div>`:''}<div class="actions"><button class="btn" id="prev" ${session.index===0?'disabled':''}>→ הקודמת</button>${session.index<qs.length-1?'<button class="btn primary" id="next">הבאה ←</button>':'<button class="btn primary" id="finish">סיום וקבלת תוצאות</button>'}</div></section><div class="qnav" aria-label="מעבר בין שאלות">${qs.map((item,i)=>`<button class="${session.answers[item.id]!==undefined?'done ':''}${i===session.index?'current':''}" data-index="${i}" aria-label="שאלה ${i+1}${session.answers[item.id]!==undefined?', נענתה':''}">${i+1}</button>`).join('')}</div><div class="actions"><button class="btn" id="save-back">שמירה וחזרה לבחנים</button>${session.index<qs.length-1?'<button class="btn" id="submit">הגשת הבוחן</button>':''}</div>`+foot();app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{session.answers[q.id]=q.options[+b.dataset.option];persist();renderQuestion()});document.getElementById('prev').onclick=()=>move(-1);if(document.getElementById('next'))document.getElementById('next').onclick=()=>move(1);app.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{session.index=+b.dataset.index;persist();renderQuestion();scrollTo(0,0)});for(let id of ['finish','submit'])if(document.getElementById(id))document.getElementById(id).onclick=finish;document.getElementById('save-back').onclick=()=>{persist();location.hash='#/adar/civics/october-27'}}
function move(d){session.index+=d;persist();renderQuestion();scrollTo(0,0)}
function finish(){let missing=session.questions.length-Object.keys(session.answers).length;if(missing&&!confirm(`נותרו ${missing} שאלות ללא תשובה. להגיש בכל זאת?`))return;session.finished=true;session.ended=Date.now();let correct=session.questions.filter(q=>session.answers[q.id]===q.answer).length;session.score=Math.round(correct/session.questions.length*100);for(let q of session.questions){saved.wrong=saved.wrong.filter(id=>id!==q.id);if(session.answers[q.id]!==q.answer)saved.wrong.push(q.id)}saved.history.push({set:session.set,score:session.score,date:session.ended});saved.history=saved.history.slice(-100);persist();results();scrollTo(0,0)}
function results(){let qs=session.questions,wrong=qs.filter(q=>session.answers[q.id]!==q.answer),correct=qs.length-wrong.length,tags=[...new Set(wrong.map(q=>q.tag))];app.innerHTML=crumbs([...exam,['תוצאות']])+`<div class="eyebrow">${esc(session.title)} · סיכום הבוחן</div><h1>${session.score>=85?'יפה, המושגים מתחברים.':session.score>=60?'יש בסיס. עכשיו מדייקים.':'עוד סבב — וההבדלים יתבהרו.'}</h1><section class="card"><div class="score">${session.score}<span style="font-size:22px"> / 100</span></div><div class="stats"><span><strong>${correct}</strong> נכונות מתוך ${qs.length}</span><span><strong>${wrong.length}</strong> שאלות לחזרה</span></div>${tags.length?`<p class="muted">נושאים לחיזוק: ${tags.map(esc).join(' · ')}</p>`:'<p>כל התשובות נכונות. נסי בוחן בנושא נוסף.</p>'}<div class="actions">${wrong.length?'<button class="btn primary" id="retry">תרגול השאלות שטעיתי בהן</button>':''}<button class="btn" id="again">ניסיון נוסף עם ערבוב חדש</button><a class="btn" href="#/adar/civics/october-27">לכל הבחנים</a></div></section><section class="review"><h2>עוברים על התשובות</h2>${qs.map((q,i)=>{let ok=session.answers[q.id]===q.answer;return `<details ${!ok?'open':''}><summary><span class="${ok?'good':'bad'}">${ok?'✓':'✕'} שאלה ${i+1}</span> · ${esc(q.q)}</summary><p>התשובה שלך: <strong>${esc(session.answers[q.id]||'לא נענתה')}</strong></p>${!ok?`<p>התשובה הנכונה: <strong>${esc(q.answer)}</strong></p>`:''}<p class="muted">${esc(q.explanation)}</p><span class="badge">${esc(q.tag)}</span></details>`}).join('')}</section>`+foot();if(wrong.length)document.getElementById('retry').onclick=()=>{mode='practice';start(-2,wrong)};document.getElementById('again').onclick=()=>start(session.set,qs)}
function render(){let r=location.hash||'#/';if(r==='#/adar')subjects();else if(r==='#/ron')childPlaceholder('Ron');else if(r==='#/harel')childPlaceholder('Harel');else if(r==='#/adar/civics')subject();else if(r==='#/adar/civics/october-27')menu();else if(r==='#/quiz')renderQuestion();else if(r==='#/adar/literature')app.innerHTML=crumbs([['Adar','#/adar'],['ספרות']])+'<section class="card empty"><span class="badge">בהמשך השנה</span><h1>ספרות</h1><p class="muted">עוד אין כאן תרגולים. נוסיף אותם כשיגיע חומר הלימוד הבא.</p><a class="btn" href="#/adar">חזרה למקצועות</a></section>'+foot();else home();}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
